1️⃣ المبيعات ونقطة البيع (Sales & POS)
تم دمج نقطة البيع والمبيعات للوصول السريع
•	شاشة البيع (الكاشير) (بدلاً من شاشة نقطة البيع)
•	وردية الكاشير (بدلاً من ورديات الكاشير)
•	فواتير المبيعات
•	مرتجعات المبيعات
•	أدراج وجلسات النقدية (بدلاً من أدراج النقدية)
•	خيارات وطرق الدفع
2️⃣ المشتريات والموردون (Purchases & Suppliers)
•	أوامر الشراء
•	استلام البضائع / الإرساليات
•	فواتير المشتروات
•	مرتجعات المشتريات
•	دليل الموردين (بدلاً من الموردون)
3️⃣ إدارة المخزون (Inventory Management)
•	الأصناف والمنتجات (بدلاً من الأصناف المخزنية)
•	إذونات الإضافة
•	إذونات الصرف
•	تحويلات المخزون
•	الجرد وتسويات المخزون (بدلاً من تسويات المخزون)
•	إذونات التالف / الهالك (بدلاً من إذونات الإتلاف)
•	حركات وأرصدة المخزون
•	المستودعات والمخازن
4️⃣ الحسابات والمالية (Finance & Accounting)
•	قائمة الأرباح والخسائر
•	ميزان المراجعة
•	القيود المحاسبية
•	شجرة الحسابات (دليل الحسابات)
•	مراكز التكلفة (بدلاً من مراكز الحسابات)
•	كشف حساب عميل / مورد (بدلاً من كشف ذمم)
•	دفتر الأستاذ العام
•	الفترات المالية والإغلاقات
5️⃣ إدارة العملاء والتسويق (CRM & Marketing)
دمج قنوات التواصل (واتساب، ماسنجر) مع خط المبيعات لتسهيل المتابعة
•	العملاء والمستهدفين (بدلاً من الكيانات)
•	الفرص والصفقات (بدلاً من الفرص)
•	المتابعات والتواصل
•	الحملات التسويقية
•	محادثات واتساب (تضمين ربط القوالب ورقم الواتساب)
•	محادثات ماسنجر
6️⃣ المتجر الإلكتروني والموقع (E-Commerce & Website)
تجميع كافة خصائص المتجر والمحتوى الإلكتروني معاً
•	الطلبات والعملاء
•	الكوبونات والخصومات
•	تقييمات المراجعات
•	تصميم وصفحات الموقع (دمج محتوى الموقع والثيمات)
•	المحافظات والمناطق
7️⃣ الموارد البشرية (Human Resources - HR)
•	الموظفون والأقسام
•	سجلات الحضور والانصراف (يشمل جدول الدوام ومواقع الحضور)
•	مسير الرواتب والعمولات (دمج دورات الرواتب والعمولات)
•	المسميات الوظيفية
8️⃣ الإعدادات والصلاحيات (Settings & Admin)
تكون دائماً في نهاية القائمة
•	إعدادات النظام العامة
•	الأدوار والصلاحيات
•	المستخدمون
•	إعدادات طباعة الفواتير والربط (Webhook)
•	وحدات القياس والعلامات التجارية

